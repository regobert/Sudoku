<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Maak een foto van een sudoku: vraag een hint of zet hem in je verzameling.">
<title>Sudoku Schrift</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#4a3fc4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sudoku">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: puzzle-boek pagina; links het raster, rechts het bedieningspaneel (zoals op de tablet), op de telefoon onder elkaar */
:root{
  --bg:#f3f5fa; --paper:#ffffff; --ink:#1c2233; --muted:#5d667c; --line:#c9cfdd; --line-strong:#2a3145;
  --accent:#4a3fc4; --accent-ink:#ffffff; --accent-soft:#e7e4fb;
  --entry:#2f62d9; --sel:#ffe27a; --peer:#eef0f7; --same:#d9d4fb;
  --bad:#d23b4c; --bad-soft:#fde3e6; --good:#1f8a5b; --good-soft:#dcf3e8; --star:#f2a516;
  --hint:#fff4c4; --hint-cell:#ffd34d;
  --c1:#ffd0d5; --c2:#ffe2b8; --c3:#fff3a8; --c4:#cdeec9; --c5:#c9e3ff; --c6:#e3d3ff;
  --f-display:"Outfit",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141c; --paper:#1b1e29; --ink:#e8eaf2; --muted:#9aa2b8; --line:#353a4c; --line-strong:#a9b0c6;
  --accent:#8d84ff; --accent-ink:#14121f; --accent-soft:#2a2650;
  --entry:#7fb0ff; --sel:#6b5a12; --peer:#232736; --same:#3b3570;
  --bad:#ff6b7a; --bad-soft:#4a1f27; --good:#4fd39a; --good-soft:#173a2b; --star:#ffbf3c;
  --hint:#3a3415; --hint-cell:#7a6612;
  --c1:#5a2a33; --c2:#5a4123; --c3:#55501f; --c4:#24482a; --c5:#1f3c5c; --c6:#3b2d5c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141c; --paper:#1b1e29; --ink:#e8eaf2; --muted:#9aa2b8; --line:#353a4c; --line-strong:#a9b0c6;
  --accent:#8d84ff; --accent-ink:#14121f; --accent-soft:#2a2650;
  --entry:#7fb0ff; --sel:#6b5a12; --peer:#232736; --same:#3b3570;
  --bad:#ff6b7a; --bad-soft:#4a1f27; --good:#4fd39a; --good-soft:#173a2b; --star:#ffbf3c;
  --hint:#3a3415; --hint-cell:#7a6612;
  --c1:#5a2a33; --c2:#5a4123; --c3:#55501f; --c4:#24482a; --c5:#1f3c5c; --c6:#3b2d5c;
  color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
a{color:var(--accent)}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.wrap{max-width:1040px;margin:0 auto}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:18px 14px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
.logo{display:grid;flex:none;width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:5px}
.logo i{background:var(--accent-ink);opacity:.9;border-radius:2px}
.logo i:nth-child(2n){opacity:.35}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 14px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--bad)}
.btn svg{width:18px;height:18px;flex:none}
.btn:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.notice{font-size:13px;color:var(--muted)}
.notice.warn{color:var(--bad)}

/* Verzameling */
.list-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-block:6px 14px}
.list-head h2{font-size:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
@media (max-width:560px){.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:10px;gap:8px}.card .mini{font-size:9px}.card h3{font-size:14px}.card .row{flex-wrap:wrap}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;text-align:left}
.card:hover{border-color:var(--accent)}
.card .mini{width:100%;aspect-ratio:1;max-width:100%;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(9,minmax(0,1fr));border:2px solid var(--line-strong);border-radius:4px;overflow:hidden;font-family:var(--f-display);font-size:11px;background:var(--paper)}
.mini span{display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.mini span.e{color:var(--entry)}
.mini span.bR{border-right:2px solid var(--line-strong)} .mini span.bB{border-bottom:2px solid var(--line-strong)}
.card .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3{font-size:16px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--peer);color:var(--muted)}
.pill.solved{background:var(--good-soft);color:var(--good)}
.pill.busy{background:var(--accent-soft);color:var(--accent)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.stars{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:12px;color:var(--star);font-family:var(--f-display)}
.stars svg{width:14px;height:14px;fill:var(--star)}
.bar{height:5px;border-radius:9px;background:var(--peer);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:10px;max-width:620px}
.empty h3{font-size:18px}
.example-tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Openingspagina */
.home{display:flex;flex-direction:column;gap:26px}
.home-hello h2{font-size:clamp(24px,4.4vw,34px);font-weight:700;letter-spacing:-.015em}
.home-hello p{margin:4px 0 0;color:var(--muted)}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.sec-title h3{font-size:17px;font-weight:600}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:4px}
.continue{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;width:100%}
.continue:hover{border-color:var(--accent)}
.continue .mini{width:100%;aspect-ratio:1;max-width:100%;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(9,minmax(0,1fr));border:2px solid var(--line-strong);border-radius:4px;overflow:hidden;font-family:var(--f-display);font-size:9px;background:var(--paper)}
.continue .info{display:flex;flex-direction:column;gap:8px;min-width:0}
.continue h4{margin:0;font-family:var(--f-display);font-size:20px}
.continue .go{align-self:flex-start;margin-top:4px}
@media (max-width:480px){.continue{grid-template-columns:96px minmax(0,1fr);gap:12px}}
.levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:860px){.levels{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.levels{grid-template-columns:repeat(2,minmax(0,1fr))}.level:last-child:nth-child(odd){grid-column:1 / -1}}
.level{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.level:hover{border-color:var(--accent)}
.level b{font-family:var(--f-display);font-size:18px}
.level span.d{font-size:12.5px;color:var(--muted)}
.level .row-stars{display:flex;gap:2px}
.level .row-stars svg{width:15px;height:15px;fill:var(--star)}
.level .row-stars svg.off{fill:var(--line)}
.level[aria-busy="true"]{opacity:.6}
.sources{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.sources{grid-template-columns:minmax(0,1fr)}}
.source{display:flex;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left}
.source:hover{border-color:var(--accent)}
.source svg{width:30px;height:30px;color:var(--accent);flex:none}
.source b{font-family:var(--f-display);font-size:16px;display:block}
.source span{font-size:12.5px;color:var(--muted)}
.brand{background:none;border:0;padding:0;text-align:left}

.photo-hero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--accent-soft);border:1px solid var(--accent);border-radius:16px;padding:16px 18px}
.photo-hero>svg{width:42px;height:42px;color:var(--accent)}
.photo-hero b{font-family:var(--f-display);font-size:19px;display:block}
.photo-hero p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.photo-hero .acts{display:flex;gap:8px;flex-wrap:wrap}
.photo-hero .acts .btn{white-space:nowrap}
@media (max-width:640px){.photo-hero{grid-template-columns:auto minmax(0,1fr)}.photo-hero .acts{grid-column:1 / -1}.photo-hero .acts .btn{flex:1}}
.filters{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.filters .tabs{align-items:center}
.filters .lbl{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-right:4px;min-width:96px}
.chip .stars{color:inherit}.chip .stars svg{fill:var(--star)}
.chip .cnt{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}
.group-h{display:flex;align-items:center;gap:8px;margin:18px 0 10px;font-family:var(--f-display);font-size:16px;font-weight:600}
.group-h:first-child{margin-top:4px}
.group-h .cnt{color:var(--muted);font-weight:400;font-size:13px}
.sortsel{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:5px 8px}

.install{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--paper);border:1px dashed var(--accent);border-radius:16px;padding:14px 16px}
.install img{width:48px;height:48px;border-radius:11px}
.install b{font-family:var(--f-display);font-size:17px;display:block}
.install p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.install .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.install{grid-template-columns:auto minmax(0,1fr)}.install .acts{grid-column:1 / -1;justify-content:flex-start}}
.kbd{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:6px;padding:0 5px;background:var(--bg);font-weight:600;color:var(--ink);white-space:nowrap}

/* Speelveld */
.play{display:grid;grid-template-columns:minmax(0,600px) minmax(260px,320px);gap:24px;align-items:start;justify-content:center}
@media (max-width:860px){.play{grid-template-columns:minmax(0,1fr);gap:14px}.panel{max-width:600px;width:100%;margin:0 auto}}
.boardcol{min-width:0;display:flex;flex-direction:column;gap:10px}
.board-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.board-head h2{font-size:19px;margin-right:auto}
.timer{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.boardbox{container-type:inline-size;width:100%;max-width:600px;margin:0 auto}
.board{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(9,minmax(0,1fr));aspect-ratio:1;max-width:100%;border:3px solid var(--line-strong);border-radius:6px;overflow:hidden;background:var(--paper);user-select:none;touch-action:manipulation}
.cell{position:relative;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--paper);padding:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:6.4cqw;font-weight:500;font-variant-numeric:tabular-nums;line-height:1;min-width:0;min-height:0;overflow:hidden}
.cell.bR{border-right:2.5px solid var(--line-strong)} .cell.bB{border-bottom:2.5px solid var(--line-strong)}
.cell.k1{background:var(--c1)}.cell.k2{background:var(--c2)}.cell.k3{background:var(--c3)}.cell.k4{background:var(--c4)}.cell.k5{background:var(--c5)}.cell.k6{background:var(--c6)}
.cell.peer{background:var(--peer)}
.cell.hh{background:var(--hint)}
.cell.same{background:var(--same)}
.cell.hc{background:var(--hint-cell)}
.cell.sel{background:var(--sel)}
.cell.given{font-weight:600;color:var(--ink)}
.cell.entry{color:var(--entry)}
.cell.wrong{color:var(--bad)}
.cell.wrong::after{content:"";position:absolute;inset:auto 18% 10% 18%;height:2px;background:var(--bad);border-radius:2px}
.cell.conflict{box-shadow:inset 0 0 0 2px var(--bad)}
.cell:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.notes{position:absolute;inset:4% 7%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);font-size:2.3cqw;font-weight:500;color:var(--muted);font-family:var(--f-body);line-height:1}
.notes span{display:flex;align-items:center;justify-content:center}
.notes span.c1{grid-area:1/1;justify-content:flex-start}.notes span.c2{grid-area:1/3;justify-content:flex-end}.notes span.c3{grid-area:3/1;justify-content:flex-start}.notes span.c4{grid-area:3/3;justify-content:flex-end}
.notes span.c5{grid-area:1/2}.notes span.c6{grid-area:3/2}.notes span.c7{grid-area:2/1;justify-content:flex-start}.notes span.c8{grid-area:2/3;justify-content:flex-end}.notes span.c9{grid-area:2/2}
.centers{position:absolute;inset:0 4%;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;font-family:var(--f-body);font-weight:600;color:var(--entry);letter-spacing:-.02em;line-height:1;text-align:center;word-break:break-all}
.centers.n1{font-size:3cqw}.centers.n2{font-size:2.6cqw}.centers.n3{font-size:2.1cqw}
.notes span.on-same,.centers .on-same{color:var(--accent);font-weight:800}

.panel{display:flex;flex-direction:column;gap:12px}
.toolrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tool{border:1px solid var(--line);background:var(--paper);border-radius:12px;aspect-ratio:1.25;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted)}
.tool svg{width:24px;height:24px;color:var(--accent)}
.tool:hover{border-color:var(--accent)}
.padgrid{display:grid;grid-template-columns:repeat(3,1fr) 0.8fr;gap:8px}
.key{position:relative;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-size:30px;font-weight:600;aspect-ratio:1.15;display:flex;align-items:center;justify-content:center}
.key:hover{filter:brightness(1.08)}
.key .left{position:absolute;right:7px;bottom:4px;font-size:11px;font-family:var(--f-body);opacity:.75;font-weight:500}
.key.done{opacity:.35}
.key.notekey{font-size:20px}
.mode{border:1px solid var(--line);background:var(--paper);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.mode[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mode .big{font-family:var(--f-display);font-size:26px;font-weight:700;border:2px solid currentColor;border-radius:6px;width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.mode .small{font-family:var(--f-display);font-size:11px;font-weight:700;border:2px solid currentColor;border-radius:6px;width:34px;height:34px;display:grid;grid-template-columns:1fr 1fr;place-items:center;line-height:1;padding:2px}
.mode svg{width:30px;height:30px}
.mode .corner{position:relative;border:2px solid currentColor;border-radius:6px;width:34px;height:34px;font-family:var(--f-display);font-size:10px;font-weight:700;line-height:1}
.mode .corner i{position:absolute;font-style:normal}
.mode .corner i:nth-child(1){left:3px;top:2px}.mode .corner i:nth-child(2){right:3px;top:2px}.mode .corner i:nth-child(3){left:3px;bottom:2px}
.mode .center{border:2px solid currentColor;border-radius:6px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:12px;font-weight:700}
.key.cornerkey{font-size:19px;align-items:flex-start;justify-content:flex-start;padding:7px 10px}
.key.centerkey{font-size:19px}
.modehelp{font-size:12.5px;color:var(--muted);margin:0}
.wide{grid-column:1 / span 2;aspect-ratio:auto;height:56px}
.hintkey{border:1px solid var(--star);background:var(--hint);color:var(--ink);border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14px;height:56px}
.hintkey svg{width:22px;height:22px;color:var(--star)}
.hintkey:hover{filter:brightness(1.04)}
.helplist{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;margin:0}
.helplist dt{display:flex;justify-content:center;color:var(--accent)}
.helplist dt svg{width:24px;height:24px}
.helplist dd{margin:0}
.swatch{border:2px solid var(--line);border-radius:12px;aspect-ratio:1.15}
.swatch.none{background:var(--paper);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.botrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.botrow .tool{aspect-ratio:auto;height:54px;flex-direction:row;gap:8px;font-size:13px;color:var(--ink)}
.hintcard{background:var(--hint);border:1px solid var(--star);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.hintcard p{margin:0}
.hintcard .acts{display:flex;gap:8px;flex-wrap:wrap}
.hintcard .lvl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.msg{border-radius:12px;padding:10px 14px;font-weight:500}
.msg.good{background:var(--good-soft);color:var(--good)}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.info{background:var(--accent-soft);color:var(--accent)}

/* Foto & controle */
.sheet-back{position:fixed;inset:0;background:rgb(10 12 20 / .55);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:40}
.sheet{background:var(--paper);border-radius:16px;max-width:520px;width:100%;max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:20px}
.sheet .preview{width:100%;max-height:300px;object-fit:contain;border-radius:10px;background:var(--peer)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:26px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--muted)}
.drop svg{width:40px;height:40px;color:var(--accent)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--paper)}
.choice button:hover{border-color:var(--accent)}
.choice button b{font-family:var(--f-display);font-size:16px}
.choice button span{font-size:12.5px;color:var(--muted)}
.choice svg{width:22px;height:22px;color:var(--accent)}
@media (max-width:420px){.choice{grid-template-columns:1fr}}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.busyline{display:flex;gap:10px;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.fields{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.photo-ref{width:100%;border-radius:10px;max-height:240px;object-fit:contain;background:var(--peer)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend b{font-family:var(--f-display);font-size:15px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:8px;border-bottom:1px solid var(--line)}
.setrow input{width:20px;height:20px;accent-color:var(--accent)}

/* Feest */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;width:100%;height:100%}
.party .sheet{text-align:center;align-items:center}
.party h2{font-size:30px}
.party .big-stars{font-size:15px}
.trophy{width:72px;height:72px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.trophy svg{width:40px;height:40px;color:var(--star)}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.trophy,.spinner{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtTime=s=>{s=Math.max(0,Math.floor(s||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- sudoku-logica ---------- */
const ROW=i=>Math.floor(i/9),COL=i=>i%9,BOX=i=>Math.floor(ROW(i)/3)*3+Math.floor(COL(i)/3);
const HOUSES=[];
for(let r=0;r<9;r++)HOUSES.push({type:"rij",n:r,cells:[...Array(9)].map((_,c)=>r*9+c)});
for(let c=0;c<9;c++)HOUSES.push({type:"kolom",n:c,cells:[...Array(9)].map((_,r)=>r*9+c)});
for(let b=0;b<9;b++){const br=Math.floor(b/3)*3,bc=b%3*3,cells=[];for(let a=0;a<3;a++)for(let d=0;d<3;d++)cells.push((br+a)*9+bc+d);HOUSES.push({type:"blok",n:b,cells})}
const PEERS=[...Array(81)].map((_,i)=>{const s=new Set();HOUSES.forEach(h=>{if(h.cells.includes(i))h.cells.forEach(j=>j!==i&&s.add(j))});return[...s]});
const bits=m=>{const o=[];for(let d=1;d<=9;d++)if(m&(1<<d))o.push(d);return o};
const pop=m=>{let c=0;while(m){m&=m-1;c++}return c};
function cands(g){const out=new Array(81).fill(0);for(let i=0;i<81;i++){if(g[i])continue;let m=0b1111111110;for(const p of PEERS[i])if(g[p])m&=~(1<<g[p]);out[i]=m}return out}
function conflicts(g){const bad=new Set();for(let i=0;i<81;i++)if(g[i])for(const p of PEERS[i])if(g[p]===g[i]){bad.add(i);bad.add(p)}return bad}
function solve(g0,limit=2){
  const g=g0.slice();if(conflicts(g).size)return{count:0,solution:null};
  let count=0,solution=null,steps=0;
  (function rec(){
    if(count>=limit||steps>200000)return;steps++;
    let best=-1,bm=0,bc=10;
    for(let i=0;i<81;i++)if(!g[i]){let m=0b1111111110;for(const p of PEERS[i])if(g[p])m&=~(1<<g[p]);const c=pop(m);if(c<bc){bc=c;best=i;bm=m;if(c<=1)break}}
    if(best<0){count++;if(!solution)solution=g.slice();return}
    if(bc===0)return;
    for(const d of bits(bm)){g[best]=d;rec();if(count>=limit)break}
    g[best]=0;
  })();
  return{count,solution,steps};
}
const BOXNAME=["linksboven","middenboven","rechtsboven","links in het midden","in het midden","rechts in het midden","linksonder","middenonder","rechtsonder"];
const houseLabel=h=>h.type==="blok"?`het blok ${BOXNAME[h.n]}`:`${h.type} ${h.n+1}`;
const cellLabel=i=>`rij ${ROW(i)+1}, kolom ${COL(i)+1}`;
/* Geeft een hint in 3 niveaus: waar kijken, welk vakje, welk cijfer. */
function findHint(givens,current,solution){
  if(current.every(v=>v))return conflicts(current).size?null:{done:true};
  const cf=conflicts(current);
  if(cf.size){const i=[...cf].find(j=>!givens[j])??[...cf][0];const h=HOUSES.find(h=>h.type==="rij"&&h.cells.includes(i));
    return{house:h.cells,cell:i,steps:[`Let op: in ${houseLabel(h)} staat een cijfer dubbel. Kijk daar eerst nog eens.`,`Dit vakje botst met een ander vakje (${cellLabel(i)}).`,`De ${current[i]} in ${cellLabel(i)} kan hier niet: hetzelfde cijfer staat al in dezelfde rij, kolom of blok.`],error:true}}
  if(solution){const wrong=current.findIndex((v,i)=>v&&!givens[i]&&v!==solution[i]);
    if(wrong>=0){const h=HOUSES[ROW(wrong)];return{house:h.cells,cell:wrong,error:true,steps:[`Er zit een fout in je puzzel, ergens in rij ${ROW(wrong)+1}.`,`Kijk nog eens naar ${cellLabel(wrong)}.`,`Hier hoort een ${solution[wrong]}, niet een ${current[wrong]}.`]}}}
  const C=cands(current);
  for(const order of["blok","rij","kolom"])for(const h of HOUSES.filter(x=>x.type===order)){
    for(let d=1;d<=9;d++){if(h.cells.some(i=>current[i]===d))continue;const pos=h.cells.filter(i=>!current[i]&&C[i]&(1<<d));
      if(pos.length===1)return{house:h.cells,cell:pos[0],digit:d,steps:[`Kijk eens naar ${houseLabel(h)}. Het cijfer ${d} kan daar maar op één plek.`,`Het gaat om ${cellLabel(pos[0])}. Waarom kan de ${d} nergens anders in ${houseLabel(h)}?`,`Hier hoort een ${d}.`]}}}
  for(let i=0;i<81;i++)if(!current[i]&&pop(C[i])===1){const d=bits(C[i])[0],h=HOUSES[18+BOX(i)];
    return{house:h.cells,cell:i,digit:d,steps:[`In ${houseLabel(h)} is een vakje waar nog maar één cijfer past. Kijk welke cijfers al in de rij, kolom en het blok staan.`,`Kijk naar ${cellLabel(i)}.`,`Alleen een ${d} past hier.`]}}
  let best=-1,bc=10;for(let i=0;i<81;i++)if(!current[i]){const c=pop(C[i]);if(c<bc){bc=c;best=i}}
  if(best<0)return null;
  const list=bits(C[best]).join(", ");const d=solution?solution[best]:null;
  return{house:HOUSES[18+BOX(best)].cells,cell:best,digit:d,steps:[`Er is nu geen eenvoudige stap. Tip: zet in ${houseLabel(HOUSES[18+BOX(best)])} kleine notities met de cijfers die nog passen.`,`In ${cellLabel(best)} passen nog maar ${bc} cijfers: ${list}. Welke kan hier niet, als je verder kijkt?`,d?`Hier hoort een ${d}.`:`Probeer hier een van deze cijfers: ${list}.`]};
}

function decodeNotes(s){const a=new Array(81).fill(0);if(typeof s==="string")for(let i=0;i<81;i++)a[i]=parseInt(s.substr(i*3,3),16)||0;return a}
const encodeNotes=a=>a.map(n=>n.toString(16).padStart(3,"0")).join("");
const toArr=s=>[...String(s||"").padEnd(81,".")].slice(0,81).map(c=>/[1-9]/.test(c)?+c:0);
const toStr=a=>a.map(v=>v||".").join("");

  seconds:p.seconds||0,solvedAt:p.solvedAt||null,hints:p.hints||0,solution:null}}

  givens:toStr(p.givens),entries:toStr(p.entries),notes:encodeNotes(p.notes),centers:encodeNotes(p.centers),colors:p.colors.join(""),seconds:Math.floor(p.seconds),solvedAt:p.solvedAt,hints:p.hints}}

/* ---------- fotoherkenning met je eigen Claude API-sleutel ---------- */
const KEY_NAME="sudoku-anthropic-key";
const getKey=()=>{try{return localStorage.getItem(KEY_NAME)||""}catch{return""}};
const setKey=k=>{try{k?localStorage.setItem(KEY_NAME,k):localStorage.removeItem(KEY_NAME)}catch{}};
const SDK_URL="./vendor/anthropic-sdk-1.6.0.mjs";
const blobToB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(b)});
function parseJSON(t){const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<a)throw{code:"bad_output"};return JSON.parse(t.slice(a,b+1))}
async function readWithClaude(blob,signal){
  const {default:Anthropic}=await import(SDK_URL);
  const client=new Anthropic({apiKey:getKey(),dangerouslyAllowBrowser:true});
  const data=await blobToB64(blob);
  const media=/^image\/(jpeg|png|gif|webp)$/.test(blob.type)?blob.type:"image/jpeg";
  const res=await client.beta.messages.create({
    model:"claude-opus-5-5",
    max_tokens:16000,
    betas:["server-side-fallback-2026-07-01"],
    fallbacks:"default",
    output_config:{effort:"medium"},
    messages:[{role:"user",content:[
      {type:"image",source:{type:"base64",media_type:media,data}},
      {type:"text",text:READ_PROMPT}]}]
  },{signal});
  if(res.stop_reason==="refusal")throw{code:"refusal"};
  if(res.stop_reason==="max_tokens")throw{code:"bad_output"};
  return parseJSON(res.content.filter(b=>b.type==="text").map(b=>b.text).join(""));
}
function readError(e){
  const st=e?.status;
  if(e?.code==="refusal")return"Claude kon deze foto niet verwerken. Probeer een andere foto.";
  if(e?.code==="bad_output"||e instanceof SyntaxError)return"De cijfers konden niet goed worden uitgelezen. Probeer het nog eens of maak een scherpere foto.";
  if(st===401)return"Je API-sleutel wordt niet geaccepteerd. Controleer de sleutel bij Instellingen.";
  if(st===403)return"Je API-sleutel heeft geen toegang. Controleer de sleutel en je account op console.anthropic.com.";
  if(st===400&&/credit|balance/i.test(e?.message||""))return"Je API-tegoed is op. Vul het aan op console.anthropic.com en probeer het opnieuw.";
  if(st===429)return"Er zijn even te veel verzoeken. Probeer het over een minuut opnieuw.";
  if(st>=500)return"Claude is even overbelast. Probeer het over een paar minuten opnieuw.";
  if(!st&&!navigator.onLine)return"Je bent niet verbonden met internet.";
  return"Het lezen van de foto is niet gelukt"+(e?.message?" ("+String(e.message).slice(0,140)+")":"")+". Probeer het nog eens of typ de puzzel zelf over.";
}

    <p>De app leest je foto's met Claude. Daarvoor heb je een eigen API-sleutel nodig van <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>. Een foto lezen kost een paar cent van je API-tegoed.</p>

    <p class="notice warn" id="keyErr" hidden></p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="button" data-act="savekey">Opslaan</button>${has?'<button class="btn danger" type="button" data-act="delkey">Sleutel verwijderen</button>':""}<button class="btn ghost" type="button" data-act="close">Annuleren</button></div>`);

function starsHTML(p){if(!p.stars&&!p.difficultyText)return"";const lbl=p.stars?`${p.stars} ${p.stars===1?"ster":"sterren"}`:p.difficultyText;

function miniHTML(p){let h="";for(let i=0;i<81;i++){const g=p.givens[i],e=p.entries[i];const cls=(COL(i)%3===2&&COL(i)<8?" bR":"")+(ROW(i)%3===2&&ROW(i)<8?" bB":"");h+=`<span class="${g?"":"e"}${cls}">${g||e||""}</span>`}return`<div class="mini" aria-hidden="true">${h}</div>`}

/* ---------- puzzels maken ---------- */
const LEVELS=[
  {key:"easy",name:"Makkelijk",stars:1,givens:40,desc:"Veel cijfers gegeven. Goed om rustig te beginnen."},
  {key:"medium",name:"Gemiddeld",stars:2,givens:33,desc:"Iets minder hulp. Je moet goed kijken."},
  {key:"hard",name:"Moeilijk",stars:3,givens:27,desc:"Weinig cijfers. Hoek- en middencijfers helpen."},
  {key:"expert",name:"Expert",stars:4,givens:0,desc:"Alleen op te lossen met slimme trucs."},
  {key:"master",name:"Meester",stars:5,givens:0,desc:"De zwaarste puzzels van de app, voor echte doorzetters."}];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fullGrid(){const g=Array(81).fill(0);
  (function fill(i){if(i===81)return true;if(g[i])return fill(i+1);
    let m=0b1111111110;for(const q of PEERS[i])if(g[q])m&=~(1<<g[q]);
    for(const d of shuffle(bits(m))){g[i]=d;if(fill(i+1))return true}g[i]=0;return false})(0);return g}
/* Lost op met alleen 'enige plek' en 'enige cijfer'; true als dat lukt. */
function singlesSolve(g0){const g=g0.slice();
  for(;;){if(g.every(Boolean))return true;const C=cands(g);let moved=false;
    for(let i=0;i<81;i++)if(!g[i]){if(!C[i])return false;if(pop(C[i])===1){g[i]=bits(C[i])[0];moved=true}}
    if(moved)continue;
    for(const h of HOUSES)for(let d=1;d<=9;d++){if(h.cells.some(i=>g[i]===d))continue;const pos=h.cells.filter(i=>!g[i]&&C[i]&(1<<d));if(pos.length===1){g[pos[0]]=d;moved=true}}
    if(!moved)return false}}
function carve(level){
  const sol=fullGrid(),g=sol.slice(),hardMode=level.stars>=4;
  for(const i of shuffle([...Array(81).keys()])){
    if(level.givens&&g.filter(Boolean).length<=level.givens)break;
    const keep=g[i];g[i]=0;
    if(solve(g,2).count!==1||(!hardMode&&!singlesSolve(g)))g[i]=keep;
  }
  return g;
}
/* 1-3 sterren: op te lossen met 'enige plek/enige cijfer'. 4: daar niet mee op te lossen.
   5: idem, en van meerdere pogingen de puzzel met de meeste zoekstappen. */
function makePuzzle(level){
  if(level.stars<=3){for(let t=0;t<12;t++){const g=carve(level);if(singlesSolve(g)||t===11)return g}}
  const tries=level.stars>=5?8:1;let best=null,bestSteps=-1;
  for(let t=0;t<30&&(best===null||t<tries);t++){
    const g=carve(level);if(singlesSolve(g))continue;
    const st=solve(g,2).steps;if(st>bestSteps){best=g;bestSteps=st}
    if(level.stars<5)break;
  }
  return best||carve(level);
}
function newPuzzle(key,btn){
  const level=LEVELS.find(l=>l.key===key);if(!level)return;
  if(btn){btn.setAttribute("aria-busy","true");btn.querySelector(".d").textContent="Puzzel maken…"}
  setTimeout(()=>{
    const g=makePuzzle(level);
    const n=[...S.puzzles.values()].filter(p=>p.source==="Gemaakt door de app"&&p.difficultyText===level.name).length+1;
    const p=normalize({id:uid(),title:`${level.name} ${n}`,stars:level.stars,difficultyText:level.name,source:"Gemaakt door de app",givens:toStr(g)});
    S.puzzles.set(p.id,p);persist(p,true);openPuzzle(p);window.scrollTo(0,0);
  },30);
}
function starRow(n,max=5){let h="";for(let k=1;k<=max;k++)h+=I.star.replace("<svg",`<svg class="${k<=n?"":"off"}" aria-hidden="true"`);return`<span class="row-stars" title="${n} van ${max} sterren">${h}</span>`}

/* ---------- verzameling: sorteren en filteren op moeilijkheid ---------- */
/* Sterren in groepen: puzzelboeken gebruiken vaak 5 tot 13 sterren. */
const RANGES=[{k:"r1",lo:1,hi:4,name:"Instap"},{k:"r5",lo:5,hi:7,name:"Gemiddeld"},{k:"r8",lo:8,hi:10,name:"Moeilijk"},{k:"r11",lo:11,hi:13,name:"Zeer moeilijk"},{k:"r14",lo:14,hi:99,name:"Extreem"}];
const RANGE_ORDER=[...RANGES.map(r=>r.k),"none"];
const diffKey=p=>{if(!p.stars)return"none";const r=RANGES.find(r=>p.stars>=r.lo&&p.stars<=r.hi);return r?r.k:"none"};
const rangeStars=r=>r.hi>=99?`${r.lo}+`:`${r.lo}–${r.hi}`;
const diffLabel=k=>{const r=RANGES.find(r=>r.k===k);return r?`${rangeStars(r)} sterren`:"Zonder niveau"};
const diffChipLabel=k=>{const r=RANGES.find(r=>r.k===k);return r?`<span class="stars">${I.star}${rangeStars(r)}</span>`:"Zonder niveau"};
function sortByDiff(a,b){const x=a.stars||99,y=b.stars||99;return x-y||b.updated-a.updated}
function saveView(){ls.set("sudoku-view",{diff:S.diff,filter:S.filter,sort:S.sort})}
function filterBar(all,{status=true,sort=true}={}){
  const keys=[...new Set(all.map(diffKey))].sort((a,b)=>RANGE_ORDER.indexOf(a)-RANGE_ORDER.indexOf(b));
  if(S.diff!=="all"&&!keys.includes(S.diff))S.diff="all";
  const cnt=k=>all.filter(p=>k==="all"||diffKey(p)===k).length;
  const dchip=k=>`<button class="chip" type="button" data-diff="${k}" aria-pressed="${S.diff===k}" aria-label="${k==="all"?"Alle niveaus":diffLabel(k)}" title="${k==="all"?"Alle niveaus":diffLabel(k)}">${k==="all"?"Alle":diffChipLabel(k)}<span class="cnt">${cnt(k)}</span></button>`;
  const f=(k,l)=>`<button class="chip" type="button" data-filter="${k}" aria-pressed="${S.filter===k}">${l}</button>`;
  return`<div class="filters">
    <div class="tabs" role="group" aria-label="Moeilijkheid"><span class="lbl">Moeilijkheid</span>${["all",...keys].map(dchip).join("")}</div>
    ${status?`<div class="tabs" role="group" aria-label="Status"><span class="lbl">Status</span>${f("all","Alle")}${f("busy","Nog niet af")}${f("solved","Opgelost")}</div>`:""}
    ${sort?`<div class="tabs"><span class="lbl">Sorteren</span><select class="sortsel" id="sortSel" aria-label="Sorteren"><option value="diff" ${S.sort==="diff"?"selected":""}>Op moeilijkheid, makkelijk eerst</option><option value="diffdesc" ${S.sort==="diffdesc"?"selected":""}>Op moeilijkheid, moeilijk eerst</option><option value="recent" ${S.sort==="recent"?"selected":""}>Laatst gespeeld</option></select></div>`:""}
  </div>`;
}
function filtered(all,useStatus=true){
  let list=all.filter(p=>S.diff==="all"||diffKey(p)===S.diff);
  if(useStatus)list=list.filter(p=>S.filter==="all"||(S.filter==="solved"?p.solvedAt:!p.solvedAt));
  if(S.sort==="recent")list.sort((a,b)=>b.updated-a.updated);
  else{list.sort(sortByDiff);if(S.sort==="diffdesc")list.sort((a,b)=>(b.stars||0)-(a.stars||0)||b.updated-a.updated)}
  return list;
}
function groupedCards(list){
  if(S.sort==="recent"||S.diff!=="all")return`<div class="cards">${list.map(p=>cardHTML(p)).join("")}</div>`;
  let h="",cur=null,buf=[];
  const flush=()=>{if(cur!==null)h+=`<h3 class="group-h">${cur==="none"?"Zonder niveau":`<span class="stars" style="font-size:15px">${I.star}</span>${diffLabel(cur)}`}<span class="cnt">${buf.length}</span></h3><div class="cards">${buf.join("")}</div>`};
  for(const p of list){const k=diffKey(p);if(k!==cur){flush();cur=k;buf=[]}buf.push(cardHTML(p))}

/* ---------- spel ---------- */
function current(p){return p.givens.map((g,i)=>g||p.entries[i])}
function openPuzzle(p){
  S.cur=p;S.sel=p.givens.findIndex(v=>!v);S.undo=[];S.redo=[];S.hint=null;S.msg=null;S.mode="num";
  if(!p.solution){const r=solve(p.givens,2);p.solution=r.count===1?r.solution:null;p.unique=r.count}
  S.view="play";render();startTimer();
}
function snapshot(){const p=S.cur;return{e:p.entries.slice(),n:p.notes.slice(),m:p.centers.slice(),c:p.colors.slice()}}
function pushUndo(){S.undo.push(snapshot());if(S.undo.length>300)S.undo.shift();S.redo=[]}
function restore(s){const p=S.cur;p.entries=s.e;p.notes=s.n;p.centers=s.m;p.colors=s.c}
function cellClasses(p,i,cur,C){
  const sel=S.sel,cls=["cell"];
  if(COL(i)%3===2&&COL(i)<8)cls.push("bR");if(ROW(i)%3===2&&ROW(i)<8)cls.push("bB");
  if(p.colors[i])cls.push("k"+p.colors[i]);
  if(S.hint){if(S.hint.house?.includes(i))cls.push("hh");if(S.hint.level>=1&&S.hint.cell===i)cls.push("hc")}
  if(sel>=0){if(S.settings.peers&&PEERS[sel].includes(i))cls.push("peer");if(S.settings.same&&cur[sel]&&cur[i]===cur[sel]&&i!==sel)cls.push("same");if(i===sel)cls.push("sel")}
  if(p.givens[i])cls.push("given");else if(cur[i])cls.push("entry");
  if(cur[i]&&!p.givens[i]){
    const showErr=S.settings.live||S.checkShown;
    if(showErr&&(p.solution?cur[i]!==p.solution[i]:C.has(i)))cls.push("wrong");
  }
  if(S.settings.live&&C.has(i))cls.push("conflict");
  return cls.join(" ");
}
function boardHTML(p,cur,editable=true){
  const C=conflicts(cur);let h="";
  for(let i=0;i<81;i++){
    let inner="";

      const sv=S.sel>=0&&S.settings.same?cur[S.sel]:0;
      if(p.notes&&p.notes[i]){inner+='<span class="notes" aria-hidden="true">';bits(p.notes[i]).forEach((d,k)=>{inner+=`<span class="c${k+1}${d===sv?" on-same":""}">${d}</span>`});inner+="</span>"}
      if(p.centers&&p.centers[i]){const ds=bits(p.centers[i]);inner+=`<span class="centers n${ds.length<=3?1:ds.length<=5?2:3}" aria-hidden="true">${ds.map(d=>d===sv?`<b class="on-same">${d}</b>`:d).join("")}</span>`}
    }
    const lbl=`${cellLabel(i)}${cur[i]?": "+cur[i]:": leeg"}${p.givens[i]?" (gegeven)":""}${!cur[i]&&p.notes?.[i]?", hoekcijfers "+bits(p.notes[i]).join(" "):""}${!cur[i]&&p.centers?.[i]?", middencijfers "+bits(p.centers[i]).join(" "):""}`;
    h+=`<button type="button" class="${cellClasses(p,i,cur,C)}" data-cell="${i}" aria-label="${lbl}" tabindex="${i===Math.max(0,S.sel)?0:-1}">${inner}</button>`;
  }
  return`<div class="boardbox"><div class="board" role="grid" aria-label="Sudoku-raster" id="board">${h}</div></div>`;
}
function renderPlay(){

function input(d){
  const p=S.cur;if(!p||S.sel<0)return;const i=S.sel;
  if(S.mode==="color"){pushUndo();p.colors[i]=d;after();return}
  if(p.givens[i]||p.solvedAt)return;
  pushUndo();
  if((S.mode==="corner"||S.mode==="center")&&d){if(p.entries[i])return S.undo.pop();
    if(S.mode==="corner")p.notes[i]^=(1<<d);else p.centers[i]^=(1<<d)}
  else if(!d){if(p.entries[i])p.entries[i]=0;
    else if(S.mode==="corner"&&p.notes[i])p.notes[i]=0;
    else if(S.mode==="center"&&p.centers[i])p.centers[i]=0;
    else{p.notes[i]=0;p.centers[i]=0}}
  else{p.entries[i]=p.entries[i]===d?0:d;
    if(p.entries[i]&&S.settings.autonotes)for(const q of PEERS[i]){p.notes[q]&=~(1<<d);p.centers[q]&=~(1<<d)}}
  after(true);
}
function after(changed){
  const p=S.cur;S.msg=null;S.checkShown=false;
  if(S.hint&&changed)S.hint=null;
  const cur=current(p);
  if(changed&&cur.every(v=>v)&&!p.solvedAt){
    if(isSolved(p,cur)){p.solvedAt=Date.now();persist(p,true);render();celebrate(p);return}
    S.msg={kind:"bad",text:"Alle vakjes zijn gevuld, maar er klopt nog iets niet. Tik op Controleer om de fouten te zien."};
  }
  persist(p);render();focusSel();
}
function isSolved(p,cur){if(conflicts(cur).size)return false;if(!cur.every(v=>v))return false;return p.solution?cur.every((v,i)=>v===p.solution[i]):true}
function focusSel(){const el=main.querySelector(`[data-cell="${S.sel}"]`);if(el&&document.activeElement?.dataset?.cell!==undefined)el.focus({preventScroll:true})}
function check(){
  const p=S.cur,cur=current(p);
  if(isSolved(p,cur)){if(!p.solvedAt){p.solvedAt=Date.now();persist(p,true)}render();celebrate(p);return}
  const C=conflicts(cur);let wrong=0;
  for(let i=0;i<81;i++)if(cur[i]&&!p.givens[i]&&(p.solution?cur[i]!==p.solution[i]:C.has(i)))wrong++;
  const left=cur.filter(v=>!v).length;
  S.checkShown=wrong>0;
  S.msg=wrong?{kind:"bad",text:`${wrong} ${wrong===1?"cijfer klopt":"cijfers kloppen"} niet. Ze zijn rood onderstreept.`}:{kind:"good",text:`Alles klopt tot nu toe. Nog ${left} ${left===1?"vakje":"vakjes"} te gaan.`};
  render();
}
function hint(){
  const p=S.cur;
  if(S.hint){if(S.hint.level<S.hint.steps.length-1){S.hint.level++;render()}return}
  const h=findHint(p.givens,current(p),p.solution);
  if(!h){S.msg={kind:"info",text:"Ik kan op dit moment geen hint geven."};render();return}
  if(h.done){S.msg={kind:"good",text:"De puzzel is al helemaal ingevuld."};render();return}
  h.level=0;S.hint=h;p.hints++;persist(p);render();
}

async function prepImage(file){
  const bmp=await createImageBitmap(file).catch(()=>null);
  if(!bmp)return file;
  const max=1600,sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",.9));
}
const READ_PROMPT=`You are reading a photo of a 9x9 sudoku puzzle. The photo may be taken at an angle, may be rotated (for example a tablet photographed sideways), and may show a printed puzzle book page or a puzzle app on a screen.

Use null for stars, difficultyText or title when there is none. difficultyText is a short Dutch phrase as the user would say it (e.g. "7 sterren", "Moeilijk", "Niveau 3"). If there is no sudoku in the photo, answer {"found":false}. Output only the JSON object, with no other text.`;

function reviewStatus(R){
  const givens=R.digits.map((v,i)=>R.kind[i]==="P"?v:0);const all=R.digits;

  if(cf.size)return{kind:"bad",text:"Er staan dubbele cijfers in een rij, kolom of blok (rood omrand). Vergelijk met je foto en verbeter ze.",solution:null,cf};
  if(nGiven<17)return{kind:"info",text:`${nGiven} cijfers ingevuld. Een sudoku heeft er minstens 17 nodig.`,solution:null,cf};
  const r=solve(givens,2);
  if(r.count===0)return{kind:"bad",text:"Met deze cijfers is de puzzel niet op te lossen. Waarschijnlijk is een cijfer verkeerd gelezen.",solution:null,cf};

}

function confetti(){
  const cv=$("#confetti");if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  cv.hidden=false;const ctx=cv.getContext("2d"),W=cv.width=innerWidth*devicePixelRatio,Hh=cv.height=innerHeight*devicePixelRatio;
  const cols=["#4a3fc4","#f2a516","#ef5b6b","#5cc477","#4f9cf0","#ffd34d","#9c74f0"];
  const parts=[...Array(220)].map((_,k)=>({x:W*(k%2?0.15:0.85),y:Hh*0.65,vx:(Math.random()-.5)*W*0.018+(k%2?1:-1)*W*0.006,vy:-Math.random()*Hh*0.03-Hh*0.012,s:(6+Math.random()*8)*devicePixelRatio,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[k%cols.length],sh:k%3}));
  const t0=performance.now();
  (function frame(t){const el=t-t0;ctx.clearRect(0,0,W,Hh);
    for(const p of parts){p.vy+=Hh*0.0006;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.globalAlpha=Math.max(0,1-el/4500);
      if(p.sh===0)ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);else if(p.sh===1){ctx.beginPath();ctx.arc(0,0,p.s/3,0,7);ctx.fill()}else{ctx.font=`${p.s*1.6}px Outfit,sans-serif`;ctx.fillText(String(1+(Math.abs(p.x|0)%9)),0,0)}ctx.restore()}
    if(el<4500)requestAnimationFrame(frame);else{ctx.clearRect(0,0,W,Hh);cv.hidden=true}})(t0);
}

/* ---------- gebeurtenissen ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-act]");if(!t)return;
  if(t.dataset.act==="closebg"&&e.target!==t)return;
  if(t.id==="btnList"){goList();return}
  if(t.id==="btnPhoto"){openPhotoSheet();return}
  if(t.id==="btnHome"){goHome();return}
  if(t.dataset.level){newPuzzle(t.dataset.level,t);return}
  if(t.id==="btnKey"){openKeySheet();return}
  if(t.dataset.filter){S.filter=t.dataset.filter;saveView();render();return}
  if(t.dataset.diff){S.diff=t.dataset.diff;saveView();render();return}
  if(t.dataset.open){let p=S.puzzles.get(t.dataset.open);
    if(!p&&t.dataset.example){p=normalize(Object.assign({},EXAMPLE,{id:uid()}));S.puzzles.set(p.id,p);persist(p,true)}
    if(p)openPuzzle(p);return}
  if(t.dataset.cell!==undefined){const i=+t.dataset.cell;if(S.view==="review"){S.review.sel=i;renderReview()}else{S.sel=i;render()}main.querySelector(`[data-cell="${i}"]`)?.focus({preventScroll:true});return}
  if(t.dataset.digit){input(+t.dataset.digit);return}
  if(t.dataset.color!==undefined){input(+t.dataset.color);return}
  if(t.dataset.mode){S.mode=t.dataset.mode;render();return}
  if(t.dataset.rdigit){reviewInput(+t.dataset.rdigit);return}
  const a=t.dataset.act;
  switch(a){
    case"close":case"closebg":closeSheet();break;
    case"photo":openPhotoSheet();break;
    case"pick":case"camera":S.quickHint=false;$("#fileIn").value="";$("#fileIn").click();break;
    case"upload":S.quickHint=false;$("#fileUp").value="";$("#fileUp").click();break;
    case"quickhint":S.quickHint=true;$("#fileIn").value="";$("#fileIn").click();break;
    case"quickhint-up":S.quickHint=true;$("#fileUp").value="";$("#fileUp").click();break;
    case"manual":startManual();break;
    case"read-hint":readHint();break;
    case"read-digi":readPhoto("digi");break;
    case"list":closeSheet();goList();break;
    case"home":goHome();break;
    case"install":if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render()})}break;
    case"installhide":ls.set("sudoku-install-hide",true);render();break;
    case"clearfilter":S.diff="all";S.filter="all";saveView();render();break;
    case"erase":input(0);break;
    case"undo":if(S.undo.length){S.redo.push(snapshot());restore(S.undo.pop());after(true)}break;
    case"redo":if(S.redo.length){S.undo.push(snapshot());restore(S.redo.pop());after(true)}break;
    case"check":check();break;
    case"hint":case"hintmore":hint();break;
    case"hintclose":S.hint=null;render();break;
    case"settings":openSettings();break;
    case"help":openHelp();break;
    case"restart":confirmSheet("Opnieuw beginnen?","Al je ingevulde cijfers, notities en kleuren worden gewist. De tijd begint weer bij 0.","Opnieuw beginnen","dorestart");break;
    case"dorestart":{const p=S.cur;pushUndo();p.entries.fill(0);p.notes.fill(0);p.centers.fill(0);p.colors.fill(0);p.seconds=0;p.solvedAt=null;p.hints=0;S.hint=null;closeSheet();after(true);break}
    case"askdelete":confirmSheet("Puzzel verwijderen?",`“${esc(S.cur?.title)}” verdwijnt uit je verzameling. Dit kun je niet ongedaan maken.`,"Verwijderen","dodelete");break;
    case"dodelete":{const id=S.cur.id;closeSheet();S.cur=null;S.view="list";removePuzzle(id).then(render);render();break}
    case"rhintmore":{const H=S.review.hintState;if(H&&H.level<H.steps.length-1)H.level++;renderReview();break}
    case"todigi":S.review.mode="digi";S.review.digits.forEach((v,i)=>{if(v&&!S.review.kind[i])S.review.kind[i]="P"});renderReview();break;
    case"rkind":{const R=S.review;if(R.sel>=0&&R.digits[R.sel]){R.kind[R.sel]=R.kind[R.sel]==="P"?"H":"P";if(R.mode==="hint")reviewHint();renderReview()}break}
    case"rerase":reviewInput(0);break;
    case"savedigi":saveDigitized();break;
    case"key":openKeySheet();break;
    case"delkey":setKey("");closeSheet();break;
    case"savekey":{const v=($("#keyIn")?.value||"").trim();const err=$("#keyErr");
      if(!v){if(getKey()){closeSheet();break}err.hidden=false;err.textContent="Vul je API-sleutel in.";break}
      if(!/^sk-ant-/.test(v)){err.hidden=false;err.textContent="Een Claude API-sleutel begint met sk-ant-. Controleer of je de hele sleutel hebt geplakt.";break}
      setKey(v);const m=keyAfter;keyAfter=null;closeSheet();
      if(m&&photo)document.dispatchEvent(new CustomEvent("readphoto",{detail:m}));else if(photo)openPhotoSheet();break}
  }
});
document.addEventListener("change",e=>{
  if((e.target.id==="fileIn"||e.target.id==="fileUp")&&e.target.files[0]){const f=e.target.files[0];
    const quick=S.quickHint;S.quickHint=false;
    prepImage(f).then(b=>{if(photo)URL.revokeObjectURL(photo.url);photo={blob:b,url:URL.createObjectURL(b)};quick?readHint():openPhotoSheet()});return}
  if(e.target.id==="sortSel"){S.sort=e.target.value;saveView();render();return}
  if(e.target.dataset.set){S.settings[e.target.dataset.set]=e.target.checked;ls.set("sudoku-settings",S.settings);if(S.view==="play")render()}
});
document.addEventListener("input",e=>{if(!S.review)return;if(e.target.id==="rTitle")S.review.title=e.target.value;if(e.target.id==="rDiff")S.review.difficultyText=e.target.value;if(e.target.id==="rStars")S.review.stars=e.target.value?+e.target.value:null});
document.addEventListener("keydown",e=>{
  if(overlay.innerHTML){if(e.key==="Escape")closeSheet();return}
  if(e.target.matches("input"))return;
  const inReview=S.view==="review",inPlay=S.view==="play";if(!inReview&&!inPlay)return;
  let sel=inReview?S.review.sel:S.sel;
  const mv={ArrowUp:-9,ArrowDown:9,ArrowLeft:-1,ArrowRight:1}[e.key];
  if(mv){e.preventDefault();sel=sel<0?0:sel;const r=ROW(sel),c=COL(sel);
    const nr=(r+(mv===-9?-1:mv===9?1:0)+9)%9,nc=(c+(mv===-1?-1:mv===1?1:0)+9)%9;sel=nr*9+nc;
    if(inReview){S.review.sel=sel;renderReview()}else{S.sel=sel;render()}
    main.querySelector(`[data-cell="${sel}"]`)?.focus({preventScroll:true});return}
  if(/^[1-9]$/.test(e.key)){e.preventDefault();inReview?reviewInput(+e.key):input(+e.key);return}
  if(e.key==="Backspace"||e.key==="Delete"||e.key==="0"){e.preventDefault();inReview?reviewInput(0):input(0);return}
  if(inPlay&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.preventDefault();document.querySelector(`[data-act="${e.shiftKey?"redo":"undo"}"]`)?.click();return}
  if(inPlay&&e.key.toLowerCase()==="n"){S.mode={num:"corner",corner:"center",center:"num",color:"num"}[S.mode];render()}
});
function goHome(){closeSheet();if(S.cur)persist(S.cur,true);S.view="home";S.cur=null;S.review=null;S.hint=null;render();window.scrollTo(0,0)}
function goList(){if(S.cur)persist(S.cur,true);S.view="list";S.cur=null;S.review=null;S.hint=null;render();window.scrollTo(0,0)}

function readHint(){readPhoto("hint").then(()=>{if(S.view==="review"&&S.review&&S.review.mode==="hint"){reviewHint();renderReview()}})}
document.addEventListener("readphoto",e=>e.detail==="hint"?readHint():readPhoto("digi"));
Object.assign(S,(({diff,filter,sort})=>({...(diff&&{diff}),...(filter&&{filter}),...(sort&&{sort})}))(ls.get("sudoku-view",{})));
loadLocal();render();initRuntime();
})();
</script>
